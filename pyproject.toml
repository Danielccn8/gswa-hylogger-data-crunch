[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gswa-hylogger-toolkit"
version = "0.1.0"
description = "CLI-first acquisition, inspection, and preparation toolkit for the GSWA HyLogger capstone."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "UWA CITS5553 Capstone Group 7" }]
dependencies = [
  "nvcl-kit>=1.3,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<25",
  "pytsg>=0.5,<1",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
analysis = [
  "psutil>=6,<9",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
]
platform = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
hylogger = "hylogger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hylogger"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hylogger/inspect.py" = ["E501"]
# Long SQL statements and generated Markdown templates read better unwrapped.
"platform/backend/main.py" = ["E501"]
"scripts/explorer_evidence.py" = ["E501"]
