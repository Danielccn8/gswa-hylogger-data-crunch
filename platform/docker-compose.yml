# Local HyLogger stack: Postgres/PostGIS plus FastAPI and the map.
# From the repository root: docker compose -p hylogger_system -f platform/docker-compose.yml up -d --build
# Source data is acquired and loaded separately.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hylogger
      POSTGRES_PASSWORD: hylogger
      POSTGRES_DB: hylogger
    ports:
      # host:container — 5433 on the host so it cannot clash with a local Postgres
      - "127.0.0.1:${HYLOGGER_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in this folder runs automatically the first time the DB is created
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/002_interval_system.sql:/docker-entrypoint-initdb.d/02_interval_system.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hylogger -d hylogger"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    environment:
      DATABASE_URL: postgresql://hylogger:hylogger@db:5432/hylogger
      SPECTRAL_PILOT_DIR: /app/spectral
    volumes:
      - ../data/system/spectral:/app/spectral:ro
    ports:
      - "127.0.0.1:${HYLOGGER_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
