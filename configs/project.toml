[project]
name = "GSWA HyLogger Data Crunch"
default_data_dir = "data"

[services]
nvcl_provider = "wa"
raw_catalog_url = "https://thredds.nci.org.au/thredds/catalog/rs07/WA/catalog.xml"
raw_file_base_url = "https://thredds.nci.org.au/thredds/fileServer/"
request_timeout_seconds = 120
retries = 4

[processed.profiles.clustering]
# SWIR is named uTSAS/sTSAS and TIR is named ujCLST/sjCLST, so a "*TSA*" pattern
# alone matches SWIR (and uTSAT-style TIR) but silently drops every ujCLST log.
# The clustering workflow treats SWIR and TIR as separate populations, so both
# naming families must be listed here.
description = "Mineralogy, weights, masks, errors, and diagnostic logs, SWIR and TIR, used by the clustering workflow."
patterns = [
  "Min* *TSA*",
  "Min* *jCLST",
  "Grp* *TSA*",
  "Grp* *jCLST",
  "Wt* *TSA*",
  "Wt* *jCLST",
  "Error *TSA*",
  "Error *jCLST",
  "SNR *TSA*",
  "Final Mask",
  "HyLogDiag",
  "Albedo",
  "Bound_Water *TSA*",
  "Unbound_Water *TSA*",
  "w2200",
  "w2250",
]

[processed.profiles.minerals]
description = "Compact mineral, group, weight, and error logs, SWIR and TIR, for rapid review."
patterns = [
  "Min* *TSA*",
  "Min* *jCLST",
  "Grp* *TSA*",
  "Grp* *jCLST",
  "Wt* *TSA*",
  "Wt* *jCLST",
  "Error *TSA*",
  "Error *jCLST",
]

[processed.profiles.tsg_swir]
description = "User-level SWIR interpretation logs only, for the first processed TSG baseline."
patterns = ["* uTSAS"]

[raw]
default_components = ["spectra"]
chunk_size_bytes = 8388608
minimum_free_space_bytes = 2147483648
