name: tir_ujclst_grp1_baseline
selection: team_raw_tsg_20
source: processed
feature_source: data/prepared/features/processed/selection_team_raw_tsg_20.parquet
unit_of_clustering: hole
feature_log: grp1_uj_clst

algorithm: kmeans

parameters:
  n_clusters: 2
  random_state: 42
  n_init: 20

preprocessing:
  missing_values: reject_unavailable_log_then_zero_unobserved_categories
  scaling: standard
  pca_variance: null  # PCA is not used before K-Means.

outputs: experiments/tir_ujclst_grp1_baseline

# TIR/jCLST whole-hole baseline for the 20-hole team cohort.
# The notebook settings control each executed run.